services:
  db:
    image: postgres:16-alpine
    container_name: joias_db_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    env_file:
      - .env.prod          # ← arquivo separado para produção
    ports:
      - "5432:5432"        # opcional: só se precisar acessar o banco externamente
    restart: always

  backend:
    build: .
    container_name: joias_backend_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - static_volume:/app/staticfiles    # volume para arquivos estáticos
      - media_volume:/app/media           # volume para uploads (futuro)
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile              # ← usa o Dockerfile de produção (nginx)
    container_name: joias_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data_prod:
  static_volume:
  media_volume: